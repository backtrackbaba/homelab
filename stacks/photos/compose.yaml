# Adapted minimally from the official Immich release Compose file:
# https://github.com/immich-app/immich/releases/latest/download/docker-compose.yml
#
# Changes from upstream:
# - IMMICH_VERSION is pinned (no "release" floating-tag fallback in practice,
#   since .env always sets it) and read release notes before bumping it.
# - Explicit BIND_ADDRESS instead of publishing immich-server on 0.0.0.0
#   implicitly.
# - UPLOAD_LOCATION/DB_DATA_LOCATION point under this repo's shared DATA_ROOT
#   convention instead of upstream's ./library, ./postgres.
# - Conservative mem/CPU limits on immich-machine-learning: this Mac also
#   runs LM Studio and Jellyfin, and there is no Apple GPU/NPU acceleration
#   for containerized Immich on macOS, so ML runs on CPU.
# - Kept isolated from the homelab core stack's Postgres/Redis, per design.

name: immich

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION}
    volumes:
      - ${UPLOAD_LOCATION}:/data
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    ports:
      - "${BIND_ADDRESS}:2283:2283"
    depends_on:
      - redis
      - database
    restart: unless-stopped
    logging: *logging
    healthcheck:
      disable: false

  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION}
    volumes:
      - model-cache:/cache
    env_file:
      - .env
    environment:
      MACHINE_LEARNING_WORKERS: ${MACHINE_LEARNING_WORKERS}
      MACHINE_LEARNING_REQUEST_THREADS: ${MACHINE_LEARNING_REQUEST_THREADS}
    restart: unless-stopped
    logging: *logging
    mem_limit: 4g
    cpus: 2
    healthcheck:
      disable: false

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9@sha256:8e8d64b405ce18f41b8e5ee20aa4687a8ed0022d1298f2ce31cdcf3a76e09411
    healthcheck:
      test: redis-cli ping || exit 1
    restart: unless-stopped
    logging: *logging

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
    shm_size: 128mb
    restart: unless-stopped
    logging: *logging
    healthcheck:
      disable: false

volumes:
  model-cache:
