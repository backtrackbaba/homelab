name: saiprasad-media

x-common: &common
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  environment: &common-env
    PUID: ${PUID}
    PGID: ${PGID}
    TZ: ${TZ}

services:
  qbittorrent:
    <<: *common
    image: lscr.io/linuxserver/qbittorrent:5.2.3
    container_name: qbittorrent
    environment:
      <<: *common-env
      WEBUI_PORT: 8080
    ports:
      - "${BIND_ADDRESS}:${QBITTORRENT_WEBUI_PORT}:8080"
      - "${BIND_ADDRESS}:6881:6881/tcp"
      - "${BIND_ADDRESS}:6881:6881/udp"
    volumes:
      - ${APPDATA_ROOT}/qbittorrent:/config
      - ${DATA_ROOT}:/data

  sonarr:
    <<: *common
    image: lscr.io/linuxserver/sonarr:4.0.19
    container_name: sonarr
    environment: *common-env
    ports:
      - "${BIND_ADDRESS}:8989:8989"
    volumes:
      - ${APPDATA_ROOT}/sonarr:/config
      - ${DATA_ROOT}:/data

  radarr:
    <<: *common
    image: lscr.io/linuxserver/radarr:6.3.0
    container_name: radarr
    environment: *common-env
    ports:
      - "${BIND_ADDRESS}:7878:7878"
    volumes:
      - ${APPDATA_ROOT}/radarr:/config
      - ${DATA_ROOT}:/data

  prowlarr:
    <<: *common
    image: lscr.io/linuxserver/prowlarr:2.5.2
    container_name: prowlarr
    environment: *common-env
    ports:
      - "${BIND_ADDRESS}:9696:9696"
    volumes:
      - ${APPDATA_ROOT}/prowlarr:/config

  bazarr:
    <<: *common
    image: lscr.io/linuxserver/bazarr:1.6.0
    container_name: bazarr
    environment: *common-env
    ports:
      - "${BIND_ADDRESS}:6767:6767"
    volumes:
      - ${APPDATA_ROOT}/bazarr:/config
      - ${DATA_ROOT}:/data

  seerr:
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    image: ghcr.io/seerr-team/seerr:v3.4.1
    container_name: seerr
    environment:
      TZ: ${TZ}
      LOG_LEVEL: info
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "${BIND_ADDRESS}:5055:5055"
    volumes:
      - ${APPDATA_ROOT}/seerr:/app/config

  navidrome:
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    image: deluan/navidrome:0.63.2
    container_name: navidrome
    environment:
      TZ: ${TZ}
      ND_MUSICFOLDER: /music
    user: "${PUID}:${PGID}"
    ports:
      - "${BIND_ADDRESS}:4533:4533"
    volumes:
      - ${APPDATA_ROOT}/navidrome:/data
      - ${MEDIA_ROOT}/music:/music:ro
