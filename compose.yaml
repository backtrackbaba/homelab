name: saiprasad-home

x-common: &common
  restart: unless-stopped
  networks:
    - proxy
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  npm:
    <<: *common
    image: jc21/nginx-proxy-manager:latest
    container_name: npm
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:80:80"
      - "${BIND_ADDRESS:-0.0.0.0}:443:443"
      - "${ADMIN_BIND_ADDRESS:-127.0.0.1}:81:81"
    env_file:
      - ./.runtime/secrets.env
    environment:
      TZ: ${TZ}
      DISABLE_IPV6: "true"
      # Only takes effect while the user table is empty; NPM ignores
      # these once an admin account exists. Safe to leave set.
      INITIAL_ADMIN_EMAIL: sai@saiprasad.io
    volumes:
      - ${DATA_ROOT}/npm/data:/data
      - ${DATA_ROOT}/npm/letsencrypt:/etc/letsencrypt
    healthcheck:
      test: ["CMD", "/usr/bin/check-health"]
      interval: 30s
      timeout: 10s
      retries: 5

  postgres:
    image: postgres:17-alpine
    container_name: postgres
    restart: unless-stopped
    networks:
      - backend
    env_file:
      - ./.runtime/secrets.env
    environment:
      TZ: ${TZ}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_DB: ${POSTGRES_ADMIN_DB}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      N8N_DB_USER: ${N8N_DB_USER}
      N8N_DB_NAME: ${N8N_DB_NAME}
    secrets:
      - postgres_admin_password
    volumes:
      - ${DATA_ROOT}/postgres:/var/lib/postgresql/data
      - ./config/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER} -d ${POSTGRES_ADMIN_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: redis
    restart: unless-stopped
    networks:
      - backend
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$(cat /run/secrets/redis_password)\""]
    secrets:
      - redis_password
    volumes:
      - ${DATA_ROOT}/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$(cat /run/secrets/redis_password)\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  n8n:
    <<: *common
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    user: "${PUID}:${PGID}"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./.runtime/secrets.env
    environment:
      TZ: ${TZ}
      GENERIC_TIMEZONE: ${TZ}
      HOME: /home/node/.n8n
      N8N_USER_FOLDER: /home/node/.n8n
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${N8N_DB_NAME}
      DB_POSTGRESDB_USER: ${N8N_DB_USER}
      N8N_HOST: ${N8N_HOST}
      N8N_PROTOCOL: https
      N8N_PORT: 5678
      WEBHOOK_URL: https://${N8N_HOST}/
      N8N_PROXY_HOPS: 1
      N8N_SECURE_COOKIE: "true"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 336
    volumes:
      - ${DATA_ROOT}/n8n:/home/node/.n8n
    networks:
      - proxy
      - backend

  ntfy:
    <<: *common
    image: binwiederhier/ntfy:latest
    container_name: ntfy
    command: serve
    environment:
      TZ: ${TZ}
    ports:
      - "${BIND_ADDRESS}:8880:80"
    volumes:
      - ./config/ntfy/server.yml:/etc/ntfy/server.yml:ro
      - ${DATA_ROOT}/ntfy/cache:/var/cache/ntfy
      - ${DATA_ROOT}/ntfy/lib:/var/lib/ntfy

  homepage:
    <<: *common
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    environment:
      TZ: ${TZ}
      HOMEPAGE_ALLOWED_HOSTS: ${HOMEPAGE_HOST}
    volumes:
      - ./config/homepage:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro

  speedtest:
    <<: *common
    image: lscr.io/linuxserver/speedtest-tracker:latest
    container_name: speedtest
    env_file:
      - ./.runtime/secrets.env
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      DB_CONNECTION: sqlite
      APP_URL: https://${SPEEDTEST_HOST}
      SPEEDTEST_SCHEDULE: "0 */6 * * *"
      PRUNE_RESULTS_OLDER_THAN: 365
    volumes:
      - ${DATA_ROOT}/speedtest:/config

  uptime-kuma:
    <<: *common
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    volumes:
      - ${DATA_ROOT}/uptime-kuma:/app/data

  dozzle:
    <<: *common
    image: amir20/dozzle:latest
    container_name: dozzle
    environment:
      TZ: ${TZ}
      DOZZLE_NO_ANALYTICS: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  dockge:
    <<: *common
    image: louislam/dockge:1
    container_name: dockge
    environment:
      DOCKGE_STACKS_DIR: /opt/stacks
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DATA_ROOT}/dockge:/app/data
      - ${STACKS_ROOT}:/opt/stacks

  vaultwarden:
    <<: *common
    image: vaultwarden/server:1.37.2
    container_name: vaultwarden
    env_file:
      - ./.runtime/secrets.env
    environment:
      TZ: ${TZ}
      DOMAIN: https://${VAULTWARDEN_HOST}
      WEBSOCKET_ENABLED: "true"
      # Flip to false once the one account is created -- see
      # docs for the exact make target/timing.
      SIGNUPS_ALLOWED: "true"
    ports:
      - "${BIND_ADDRESS}:8222:80"
    volumes:
      - ${DATA_ROOT}/vaultwarden:/data

  diun:
    <<: *common
    image: crazymax/diun:4.33.0
    container_name: diun
    command: serve
    env_file:
      - ./.runtime/secrets.env
    environment:
      TZ: ${TZ}
      DIUN_WATCH_WORKERS: "10"
      DIUN_WATCH_SCHEDULE: "0 0 8 * * *"
      DIUN_PROVIDERS_DOCKER: "true"
      DIUN_PROVIDERS_DOCKER_WATCHBYDEFAULT: "true"
      DIUN_NOTIF_WEBHOOK_ENDPOINT: http://ntfy/diun-updates
      DIUN_NOTIF_WEBHOOK_METHOD: POST
      # DIUN_NOTIF_WEBHOOK_HEADERS_AUTHORIZATION comes from env_file above
      # (secrets.enc.env), not this environment: block -- env_file values
      # aren't subject to ${...} substitution, so setting it here would
      # silently pick up nothing. Same class of bug as the Immich
      # DB_PASSWORD issue; see stacks/photos/README.md.
      #
      # No bodyTemplate field exists on Diun's webhook notifier (despite
      # the docs page implying it does) -- it always sends its own fixed
      # JSON payload. See stacks/media/README.md-style notes: verified
      # what ntfy actually does with that payload before trusting it.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${DATA_ROOT}/diun:/data

networks:
  proxy:
    name: saiprasad_proxy
  backend:
    name: saiprasad_backend
    internal: true

secrets:
  postgres_admin_password:
    file: ./.runtime/postgres_admin_password
  redis_password:
    file: ./.runtime/redis_password
